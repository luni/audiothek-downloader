[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiothek-downloader"
version = "0.4"
description = "Script that can download mp3s and covers from ARD audiothek"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
dependencies = [
    "requests>=2.34.2",
    "mutagen>=1.48.1",
    "filelock>=3.25.2",
]

[project.scripts]
audiothek = "audiothek.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["audiothek*"]

[tool.setuptools.package-data]
audiothek = ["graphql/*.graphql"]


[dependency-groups]
dev = [
    "pytest-aiohttp>=1.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "graphql-core>=3.2.12",
    "ruff>=0.16.6",
    "tox>=4.61.3",
    "pytest-asyncio>=1.4.0",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "vulture>=2.16",
    "pyright>=1.1.411",
    "bandit>=1.9.4",
    "aiohttp>=3.14.3",
    "pygments>=2.21.0",
]

[tool.ruff]
exclude = ["docs", "tests"]
line-length = 160
indent-width = 4  # Same as autopep8 default

[tool.ruff.format]
quote-style = "double"  # Or "single" if you prefer
indent-style = "space"  # Use spaces instead of tabs
line-ending = "lf"  # Keep consistency
preview = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
extend-select = [
    "ANN",
    "UP",
    "UP042",
    "I"
]
select = ["E9", "F82", "D"]  # Syntax errors + docstrings
ignore = ["D203", "D213", "D100", "F821"]  # Ignore specific docstring rules

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--cov=audiothek",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-fail-under=85",
]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
exclude = ["**/__pycache__", "**/node_modules", "**/dist", "**/build", "**/venv", "**/.venv", "**/tests"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.vulture]
exclude = ["dist", "build", "venv", ".venv", "tests"]
ignore_decorators = ["@app.route", "@require_*"]
ignore_names = ["visit_*", "do_*"]
# make_whitelist = true
min_confidence = 80
paths = ["."]
sort_by_size = true
